<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<title>아카이브 인사이트 v2</title>
<style>
/* v2 셸 기본 스타일 */
:root {
  color-scheme: light;
  --paper: #f6f2e9;
  --ink: #222b3b;
  --muted: #716e65;
  --line: #ddd6ca;
  --accent: #c3412f;
  --soft: #efe9db;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 10.5pt/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 18px;
}
/* 헤더 */
header {
  padding: 28px 0 16px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 16px;
}
header h1 {
  margin: 0 0 4px;
  font-size: 1.4em;
  letter-spacing: -0.02em;
}
header .sub {
  color: var(--muted);
  font-size: 0.85em;
  margin: 0;
}
.ver-badge {
  display: inline-block;
  font-size: 0.7em;
  background: var(--ink);
  color: var(--paper);
  padding: 2px 8px;
  border-radius: 10px;
  vertical-align: middle;
  margin-left: 8px;
  font-weight: 600;
}
/* 로딩 UI */
#loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 80px 20px;
  gap: 16px;
  text-align: center;
}
#loading[hidden] { display: none; }
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-detail {
  color: var(--muted);
  font-size: 0.9em;
  margin: 0;
}
/* 에러 UI */
#error {
  padding: 40px 20px;
  text-align: center;
}
#error[hidden] { display: none; }
#error-message {
  color: var(--accent);
  margin: 0 0 16px;
}
#error button {
  background: var(--ink);
  color: var(--paper);
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 1em;
  cursor: pointer;
}
/* 오프라인 배지 */
#offline-badge {
  display: inline-block;
  background: #8a6d1b;
  color: #fff;
  font-size: 0.75em;
  padding: 3px 10px;
  border-radius: 10px;
  margin-left: 8px;
}
#offline-badge[hidden] { display: none; }
/* 글 목록 */
#articles {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 60px;
}
/* 인쇄 CSS (v1과 동일) */
@page { margin: 14mm 12mm; }
@media print {
  body { zoom: 0.5; }
  #loading, #error { display: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>아카이브 인사이트 <span class="ver-badge">v2</span><span id="offline-badge" hidden>오프라인</span></h1>
    <p class="sub">JSON 기반 자동 업데이트 아카이브 · <span id="article-count"></span></p>
  </header>

  <!-- 로딩 UI -->
  <div id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <p><strong>아카이브를 불러오는 중...</strong></p>
    <p id="loading-detail" role="status">준비 중...</p>
  </div>

  <!-- 에러 UI -->
  <div id="error" hidden>
    <p id="error-message" role="alert"></p>
    <button id="retry-btn" type="button">다시 시도</button>
  </div>
  <noscript><p style="text-align:center;padding:40px;">이 아카이브는 JavaScript가 필요합니다.</p></noscript>

  <!-- 메인 콘텐츠 -->
  <main hidden>
    <div id="articles"></div>
  </main>
</div>

<!-- v2 JS 모듈 -->
<script src="js/render.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/app.js"></script>
<script src="js/app.js"></script>
</body>
</html>
